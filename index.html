<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Jiaru 的个人空间。在音乐、设计与 AI 之间，记录灵感，创造回响。探索个人简历、AI 音乐创作、AI 产品作品与精选歌单。" />
    <title>JIARU — 让热爱有回响</title>
    <style>
      #boot-loader{position:fixed;z-index:9999;inset:0;padding:22px clamp(22px,5vw,72px);overflow:hidden;background:#f7f7f2;color:#263f3d;font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;transition:opacity .28s ease,visibility .28s ease}
      #boot-loader.is-ready{opacity:0;visibility:hidden;pointer-events:none}
      .boot-content{width:min(1310px,100%);height:100%;margin:auto}
      .boot-nav{display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 23px;border:1px solid #fff;border-radius:20px;background:#ffffff70;box-shadow:0 8px 24px #52665508}
      .boot-brand{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:650;letter-spacing:2px}
      .boot-symbol{display:flex;align-items:center;gap:3px;width:25px;height:29px;transform:rotate(17deg)}
      .boot-symbol i{display:block;width:5px;height:18px;border-radius:4px;background:#679b89}
      .boot-symbol i:nth-child(2){height:27px}.boot-symbol i:nth-child(3){height:13px;align-self:flex-start;margin-top:4px}
      .boot-status{display:flex;align-items:center;gap:9px;color:#74887d;font-size:9px;letter-spacing:1px}
      .boot-loader-ring{width:15px;height:15px;border:1.5px solid #8eac9e38;border-top-color:#729786;border-radius:50%;animation:boot-spin .8s linear infinite}
      .boot-hero{display:grid;grid-template-columns:1.08fr 1fr;align-items:center;min-height:calc(100% - 68px);padding:0 16px}
      .boot-kicker{display:inline-block;padding:7px 11px;border:1px solid #fff;border-radius:999px;background:#ffffff70;color:#688377;font-size:9px;letter-spacing:.7px}
      .boot-title{margin:24px 0 0;font-size:clamp(40px,4.4vw,62px);font-weight:500;line-height:1.4}
      .boot-title span{color:#6f9988}
      .boot-english{margin:13px 0 0;color:#7b9382;font:italic 21px "Iowan Old Style","Baskerville",serif}
      #boot-message{margin:25px 0 0;color:#74887d;font-size:10px;letter-spacing:.7px;line-height:1.8}
      #boot-retry{min-height:40px;margin-top:16px;padding:0 16px;border:1px solid #9bb5a84f;border-radius:8px;background:#e6eee8;color:#4f7061;font:inherit;font-size:11px;cursor:pointer}
      .boot-art{position:relative;height:min(54vw,500px)}
      .boot-art::before,.boot-art::after{content:"";position:absolute;border:1px solid #91af9633;border-radius:50%;transform:rotate(29deg)}
      .boot-art::before{width:58%;height:75%;left:20%;top:11%}
      .boot-art::after{width:46%;height:15%;left:27%;bottom:13%;transform:rotate(-6deg)}
      .boot-bars{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:7px;transform:translate(-50%,-50%) rotate(17deg)}
      .boot-bars i{display:block;width:9px;height:110px;border-radius:8px;background:#83ab9b}
      .boot-bars i:nth-child(2){height:185px;background:#668e7e}.boot-bars i:nth-child(3){height:74px;background:#d3a895}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media(max-width:767px){#boot-loader{padding:17px 22px}.boot-nav{height:64px;padding-inline:18px;border-radius:18px}.boot-status>span{display:none}.boot-hero{display:block;min-height:0;padding:52px 12px 0}.boot-title{font-size:clamp(34px,9vw,46px);line-height:1.45}.boot-english{font-size:20px}.boot-art{height:250px;margin-top:2px}.boot-art::before{width:42%;height:75%;left:29%}.boot-art::after{width:45%;left:28%}.boot-bars i{height:72px}.boot-bars i:nth-child(2){height:125px}.boot-bars i:nth-child(3){height:50px}}
      @media(prefers-reduced-motion:reduce){#boot-loader{transition:none}.boot-loader-ring{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite">
      <div class="boot-content">
        <div class="boot-nav">
          <div class="boot-brand"><span class="boot-symbol" aria-hidden="true"><i></i><i></i><i></i></span><strong>JIARU.</strong></div>
          <div class="boot-status"><span class="boot-loader-ring" aria-hidden="true"></span><span>PERSONAL SPACE</span></div>
        </div>
        <div class="boot-hero">
          <div>
            <span class="boot-kicker">CURIOSITY · CREATION · LIFE</span>
            <p class="boot-title">让灵感生长，<br /><span>让热爱有回响。</span></p>
            <p class="boot-english">A little curiosity. A little creation.</p>
            <p id="boot-message">正在打开这片个人空间…</p>
            <button id="boot-retry" type="button" hidden onclick="location.reload()">重新加载</button>
          </div>
          <div class="boot-art" aria-hidden="true"><span class="boot-bars"><i></i><i></i><i></i></span></div>
        </div>
      </div>
    </div>
    <!-- #region debug-point A:C:D:html-visible -->
    <script>fetch("http://127.0.0.1:7777/event",{method:"POST",body:JSON.stringify({sessionId:"mobile-home-white-screen",runId:"iteration-2-post-fix",hypothesisId:"A,C,D",location:"index.html:boot-loader",msg:"[DEBUG] HTML parser reached boot loader",data:{now:performance.now(),responseStart:performance.getEntriesByType("navigation")[0]?.responseStart||0,effectiveType:navigator.connection?.effectiveType||"unknown",saveData:navigator.connection?.saveData||false},ts:Date.now()})}).catch(()=>{});</script>
    <!-- #endregion -->
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var loader = document.getElementById('boot-loader')
        if (!loader || loader.classList.contains('is-ready')) return
        var message = document.getElementById('boot-message')
        var retry = document.getElementById('boot-retry')
        if (message) message.textContent = '加载时间有点久，请检查网络后重新加载。'
        if (retry) retry.hidden = false
      }, 15000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
